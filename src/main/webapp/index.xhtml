<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition
        template="/WEB-INF/templates/template.xhtml">
    <ui:define name="title">
        Liste des livres
    </ui:define>
    <ui:define name="content">
        <div class="card shadow p-4">
            <h1>
                Liste des livres
            </h1>
            <h:dataTable value="#{livreBean.livres}"
                         var="livre"
                         styleClass="table table-striped">
                <h:column>
                    <f:facet name="header">
                        Titre
                    </f:facet>
                    #{livre.titre}
                </h:column>
                <h:column>
                    <f:facet name="header">
                        Auteur
                    </f:facet>
                    #{livre.auteur}
                </h:column>
                <h:column>
                    <f:facet name="header">
                        Stock
                    </f:facet>
                    #{livre.stock}
                </h:column>
                <h:column>
                    <f:facet name="header">
                        Action
                    </f:facet>
                    <h:link
                            value="Modifier"
                            outcome="modifierLivre"
                            styleClass="btn btn-warning btn-sm me-2">
                        <f:param
                                name="id"
                                value="#{livre.id}"/>
                    </h:link>

                    <h:commandLink
                            value="Supprimer"
                            action="#{livreBean.supprimer(livre.id)}"
                            styleClass="btn btn-danger btn-sm"
                            onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce livre ?');"/>
                </h:column>
            </h:dataTable>
        </div>
    </ui:define>
</ui:composition>
</html>
