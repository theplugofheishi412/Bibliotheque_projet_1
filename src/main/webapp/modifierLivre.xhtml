<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition
        template="/WEB-INF/templates/template.xhtml">
    <f:metadata>
        <f:viewParam
                name="id"
                value="#{livreBean.id}"/>
        <f:viewAction
                action="#{livreBean.chargerLivre}"/>
    </f:metadata>
    <ui:define name="title">
        Modifier un livre
    </ui:define>
    <ui:define name="content">
        <div class="card shadow p-4">
            <h1>
                Modifier un livre
            </h1>
            <h:inputHidden value="#{livreBean.livre.id}"/>
            <div class="mb-3">
                <h:outputLabel value="Titre"/>
                <h:inputText
                        value="#{livreBean.livre.titre}"
                        styleClass="form-control"/>
            </div>
            <div class="mb-3">
                <h:outputLabel value="Auteur"/>
                <h:inputText
                        value="#{livreBean.livre.auteur}"
                        styleClass="form-control"/>
            </div>
            <div class="mb-3">
                <h:outputLabel value="Stock"/>
                <h:inputText
                        value="#{livreBean.livre.stock}"
                        styleClass="form-control"/>
            </div>

            <div class="d-flex gap-2">
                <h:commandButton
                        value="Modifier"
                        action="#{livreBean.modifier}"
                        styleClass="btn btn-warning"/>

                <h:commandButton
                        value="Supprimer"
                        action="#{livreBean.supprimer(livreBean.id)}"
                        styleClass="btn btn-danger"
                        onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce livre ?');"/>
            </div>

        </div>
    </ui:define>
</ui:composition>
</html>
